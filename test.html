:root{--blue:#568ba5;--violet:#8659cf;--teal:#168c94;--amber:#d89a25}

.kpi:hover,.familycard:hover{transform:translateY(-4px);box-shadow:0 12px 28px #25324c12}

let current='family/TX2',chartMetric='ca';const $=s=>document.querySelector(s);const fmt=(v,d=1)=>v.toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});

function spark(i=0){let v=[29,24,28,17,21,11,15,4].map((y,j)=>`${j*12},${Math.max(3,y+(i%3)*2)}`).join(' ');return `<svg class="spark" viewBox="0 0 86 40" aria-hidden="true"><path d="M${v.replaceAll(' ',' L')} L84,40 L0,40Z" fill="#fff0f2"/><polyline points="${v}" fill="none" stroke="#e54255" stroke-width="1.5"/></svg>`}
const kpi=(title,value,delta,ic,target,sub='vs période précédente',i=0)=>`<button class="kpi" ${target?`data-go="${target}"`:`data-detail="${title}"`}><div class="kpihead">${icon(ic)}<div><h3>${title}</h3><small>${sub}</small></div></div><div class="kpivalue"><strong>${value}</strong><span class="delta">${delta}</span></div>${spark(i)}</button>`;

function lineChart(metric='ca'){const units=metric==='units',margin=metric==='margin';let max=units?160:margin?40:16;let vals=(units?[65,72,68,80,87,93,89,105,110,121,118,132]:margin?[27,28,27,29,30,29,31,32,31,33,32,34]:[6.5,7.2,7,8.5,9.3,9,10.7,11.2,10.8,12.4,12.8,13]).map(v=>v*(margin?1:factor()));max=margin?40:max*Math.max(1,factor());let pts=vals.map((v,i)=>[40+i*36,195-v/max*155]);return `<svg class="chart" role="img" aria-label="Tendance mensuelle ${units?'des unités vendues':margin?'de la marge brute':'du chiffre d’affaires'}, données simulées" viewBox="0 0 460 235">${[0,1,2,3,4].map(i=>`<path d="M40 ${195-i*40}H442" stroke="#eef0f3"/><text x="5" y="${199-i*40}">${Math.round(max*i/4)}</text>`).join('')}<path d="M${pts.map(p=>p.join(',')).join(' L')} L436,195 L40,195Z" fill="#fff1f3"/><polyline points="${pts.map(p=>[p[0],p[1]+16].join(',')).join(' ')}" stroke="#c6ccd5" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" stroke="#45758a" stroke-width="2" fill="none"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#45758a"><title>${['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'][i]} : ${fmt(vals[i])} ${units?'unités':margin?'%':'M€'}</title></circle><text x="${p[0]}" y="219" text-anchor="middle">${['J','F','M','A','M','J','J','A','S','O','N','D'][i]}</text>`).join('')}</svg><div class="chart-note"><span><span class="dot"></span>${$('#period').value} · ${units?'Unités':margin?'Marge (%)':'CA (M€)'}</span><span>--- Année précédente</span></div>`}
function bars(labels,values,suffix='%'){return `<div>${labels.map((l,i)=>`<div class="mini-row"><span>${l}</span><div class="track" style="height:18px;background:#f6f7f9"><div class="fill" style="width:${values[i]/Math.max(...values)*95}%;background:${i===0?'#45758a':'#f1b0b9'}"></div></div><b style="width:56px;text-align:right;font-size:11px">${fmt(values[i])}${suffix}</b></div>`).join('')}</div>`}

function domainPage(key){let c=configs[key],fac=factor(),ic=domains.find(d=>d[0]===key)[2];return `<div class="heading"><div><h1>${c.title}</h1><p class="intro">${c.desc}</p></div><button data-export="${key}">↓ Exporter CSV</button></div><div class="grid kpis">${c.metrics.map((m,i)=>{let val=m[1];if(/M€/.test(val)){let n=parseFloat(val.replace(',','.'));val=fmt(n*fac)+' M€'}if(m[0]==='Unités vendues')val=Math.round(3300*fac).toLocaleString('fr-FR');return kpi(m[0],val,m[2],ic,null,m[0]==='Part de marché'?'Définition métier en attente':'Démonstration · '+$('#period').value,i)}).join('')}</div><div class="grid twocol">${panel(c.chart,bars(c.labels,c.values.map(v=>c.suffix===' M€'?v*fac:v),c.suffix))}${panel('Évolution du chiffre d’affaires · contexte',lineChart())}</div>${panel('Détail · scénario de référence',table(c.head,c.rows)+`<p class="section-note">${c.note} Le tableau détaillé décrit le scénario de référence 2026 / TX2 / Monde ; les filtres pilotent les KPI monétaires et le graphique CA.</p>`)}<div style="margin-top:20px">${panel('Points d’attention',alerts())}</div>`}
function portfolio(){return `<div class="heading"><div><h1>Portfolio de robots</h1><p class="intro">Une vue commune de vos familles et de leurs trajectoires.</p></div><button data-go="comparison">Comparer les familles →</button></div><div class="grid familycards">${Object.keys(families).map((f,i)=>`<button class="familycard" data-go="family/${f}">${robot(f)}<span class="tag good">En croissance</span><h2>${f}</h2><p>${families[f].subtitle}</p><footer><span>${families[f].models.length} modèles</span><span style="color:var(--red)">Explorer la famille →</span></footer></button>`).join('')}${panel('Votre portfolio',`<p class="intro">2 familles illustratives<br>9 modèles dans ce prototype</p><div class="ring"><div class="ringviz" data-label="2"></div></div><p class="section-note">Hiérarchie produit proposée. Les spécifications de ce PoC ne constituent pas des fiches techniques officielles.</p>`)}</div>${panel('Catalogue des produits',table(['Modèle','Famille','Statut',''],Object.entries(families).flatMap(([f,d])=>d.models.map(m=>[m,f,'<span class="badge green">Actif</span>',`<button class="textlink" data-go="product/${m}">Fiche produit →</button>`]))))}`}
function overview(){return `<div class="heading"><div><h1>Vue d’ensemble</h1><p class="intro">Le bon niveau de recul pour piloter votre Product Line.</p></div><button class="primary" data-go="portfolio">Explorer le portfolio →</button></div><div class="grid kpis">${kpi('Chiffre d’affaires',fmt(128.4*factor())+' M€','+18 %','sales','sales')}${kpi('Marge brute','32,4 %','+2,8 pts','cost','costs')}${kpi('OTD','94,2 %','+2,8 pts','factory','industrial')}${kpi('Applications hors spec','2,4 %','−0,6 pt','apps','applications')}${kpi('MTBF','42 000 h','+8 000 h','service','service')}${kpi('Adoption logiciel','72 %','+9 pts','soft','software')}</div><div class="grid twocol">${chartPanel()}${panel('Priorités du Product Manager',alerts())}</div>${panel('Prochaines étapes du portfolio',lifecycle(),'<button class="textlink" data-go="roadmap">Roadmap complète →</button>')}`}
function comparison(){return `<div class="heading"><div><h1>Comparaison des familles</h1><p class="intro">Comparer le scénario de référence 2026 / Monde, à périmètre constant.</p></div></div>${panel('Performance croisée',table(['Indicateur','TX2','TS2'],[['Chiffre d’affaires','128,4 M€','79,6 M€'],['Croissance','18 %','21 %'],['Marge brute','32,4 %','31,8 %'],['OTD','94,2 %','96,1 %'],['MTBF','42 000 h','46 000 h'],['Adoption logiciel','72 %','65 %'],['Explorer','<button class="textlink" data-go="family/TX2">Famille TX2 →</button>','<button class="textlink" data-go="family/TS2">Famille TS2 →</button>']]))}<div class="grid twocol" style="margin-top:20px">${panel('Chiffre d’affaires par famille',bars(['TX2','TS2'],[128.4,79.6],' M€'))}${panel('Livraisons à l’heure',bars(['TX2','TS2'],[94.2,96.1],' %'))}</div>`}
function roadmap(){return `<div class="heading"><div><h1>Roadmap produits</h1><p class="intro">Une trajectoire partagée, du développement au lancement.</p></div><button class="primary" data-detail="Revue de roadmap">Préparer une revue</button></div><div class="grid kpis">${kpi('Initiatives en cours','6','2 familles','road',null,'Scénario de roadmap')}${kpi('Prochain lancement','T3 2027','En préparation','box',null,'Nouvelle génération')}${kpi('Jalons validés','4 / 6','67 %','compare',null,'Scénario de roadmap')}</div>${panel('Plan produit · 2026–2027',`<div class="roadboard"><div class="roadinner"><div class="roadrow roadlabels"><b>Initiative</b><span>T4 2026</span><span>T1 2027</span><span>T2 2027</span><span>T3 2027</span></div>${[['TX2 · Nouvelle génération','Étude produit','Conception','Validation','Lancement'],['TS2 · Cleanroom','Qualification','Pilote','Lancement','Suivi série'],['Contrôleur · Évolution','Développement','Tests','Déploiement','Amélioration'],['Service · Care Packs','Cadrage','Offre pilote','Extension','Bilan']].map(r=>`<div class="roadrow"><b>${r[0]}</b>${r.slice(1).map((x,i)=>`<button class="milestone ${i!==2?'neutral':''}" data-detail="${r[0]} · ${x}">${x}</button>`).join('')}</div>`).join('')}</div></div><p class="section-note">Plan entièrement fictif. Cliquez sur un jalon pour consulter sa fiche de démonstration.</p>`)}<div style="margin-top:20px">${panel('Décisions à préparer',alerts())}</div>`}

function render(){current=location.hash.slice(1)||'family/TX2';let body,title;if(current.startsWith('family/')){let f=current.split('/')[1];if(!families[f])return go('portfolio');$('#family').value=f;body=familyPage(f);title='Portfolio / Familles de robots / '+f}else if(current.startsWith('product/')){let m=current.split('/')[1],f=Object.keys(families).find(f=>families[f].models.includes(m));if(!f)return go('portfolio');$('#family').value=f;body=familyPage(f,m);title='Portfolio / '+f+' / '+m}else if(configs[current]){body=domainPage(current);title='Performance / '+configs[current].title}else{let pages={overview:[overview,'Vue d’ensemble'],portfolio:[portfolio,'Portfolio'],comparison:[comparison,'Comparaison'],roadmap:[roadmap,'Roadmap']};if(!pages[current])return go('overview');body=pages[current][0]();title=pages[current][1]}renderNav();$('#main').innerHTML=`<div class="crumb"><span>Workspace &nbsp; / &nbsp; ${title}</span><span class="demo">Données de démonstration</span></div>${body}<footer class="footer"><span>Stäubli Robotics · Product Line Workspace</span><span>${$('#period').value} · ${$('#family').value} · ${$('#region').value} &nbsp; | &nbsp; PoC v0.1</span></footer>`;document.title=title+' · Stäubli';}

const realModels=SOURCE.models, modelByName=Object.fromEntries(realModels.map(m=>[m.name,m]));

families.TX2.tags=['6 axes','Charge 2–170 kg','Portée 515–2 609 mm'];families.TS2.tags=['SCARA · 4 axes','Charge 8,4 kg','Portée 460–1 000 mm'];
let catalogueQuery='',catalogueStatus='all',catalogueOrder='name',catalogueDirection=1,roadFocus=2;
const roadSteps=[['2024','Exploration','Analyser les usages et les attentes du marché.','Étude des applications','Cadrage des besoins'],['2025','Conception','Définir la prochaine évolution de la gamme.','Architecture produit','Prototype de validation'],['2026','Industrialisation','Préparer les essais et la montée en production.','Validation industrielle','Préparation du service'],['2027','Lancement','Accompagner la disponibilité commerciale.','Formation commerciale','Déploiement logiciel'],['2028','Évolution','Enrichir la gamme à partir des retours du terrain.','Options spécialisées','Revue de fiabilité']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sourceLabel=(text,kind='real')=>`<span class="source-pill ${kind}">${kind==='real'?'✓':'◌'} ${text}</span>`;
robot=function(f='TX2'){let m=modelByName[f]||modelByName[f==='TS2'?'TS2-60':'TX2-90'];return `<img class="robot real-robot" src="${m.image}" alt="${m.name} — photo extraite de la brochure Stäubli" loading="lazy">`};
function specRows(m){return [['Famille',m.family+(m.family==='TS2'?' · SCARA · 4 axes':' · 6 axes')],['Charge utile',fmt(m.load)+' kg'],['Portée au poignet',m.reach.toLocaleString('fr-FR')+' mm'],['Répétabilité X-Y (ISO 9283)','± '+fmt(m.repeatability,3)+' mm'],['Protection',m.protection],[m.family==='TS2'?'Cadence':'Vitesse cartésienne maximale',fmt(m.speed)+' '+m.speedUnit],['Consommation · VDMA 24608',fmt(m.energy,3)+' kWh'],['Montage',m.mounting],['Contrôleur compatible',m.controller],['Huile alimentaire','NSF H1']];}
function catalogueTable(list=realModels){return `<div class="catalogue-tools"><label class="table-search">${icon('box')}<input id="catalogueQuery" type="search" aria-label="Rechercher un modèle" placeholder="Rechercher un modèle…" value="${esc(catalogueQuery)}"></label><select id="catalogueStatus" aria-label="Filtrer les statuts de démonstration"><option value="all">Tous les statuts · démo</option><option value="active" ${catalogueStatus==='active'?'selected':''}>Actif · démo</option><option value="inactive" ${catalogueStatus==='inactive'?'selected':''}>Inactif · démo</option></select><button data-sort="name">Modèle ${catalogueOrder==='name'?(catalogueDirection===1?'↑':'↓'):'↕'}</button><button data-sort="load">Charge ${catalogueOrder==='load'?(catalogueDirection===1?'↑':'↓'):'↕'}</button></div><div id="catalogueRows">${catalogueRows(list)}</div><p class="section-note">Spécifications et photos : brochure Stäubli, 02/2026, p. 3. Les statuts Actif / Inactif sont des scénarios de démonstration, pas des informations du constructeur.</p>`}
function catalogueRows(list=realModels){let sorted=list.filter(m=>m.name.toLowerCase().includes(catalogueQuery.toLowerCase())&&(catalogueStatus==='all'||(catalogueStatus==='inactive')===['TX2-60L','TS2-40'].includes(m.name))).sort((a,b)=>catalogueDirection*(catalogueOrder==='load'?a.load-b.load:a.name.localeCompare(b.name,undefined,{numeric:true})));return table(['Produit','Famille','Charge','Portée','Statut · démo',''],sorted.map(m=>[`${robot(m.name)}<b>${m.name}</b>`,m.family,fmt(m.load)+' kg',m.reach.toLocaleString('fr-FR')+' mm',`<span class="badge ${['TX2-60L','TS2-40'].includes(m.name)?'inactive':'green'}">${['TX2-60L','TS2-40'].includes(m.name)?'Inactif':'Actif'} · démo</span>`,`<button class="catalogue-open" data-go="product/${m.name}">Explorer →</button>`]))+(sorted.length?'':'<div class="empty">Aucun modèle ne correspond aux filtres.</div>')}
portfolio=function(){return `<div class="heading"><div><div class="eyebrow">VOTRE UNIVERS ROBOTIQUE</div><h1>Un portfolio. Toutes les possibilités.</h1><p class="intro">15 robots, deux familles et des environnements spécialisés.</p></div><button data-go="comparison">Comparer les familles ↗</button></div><div class="portfolio-cards">${['TX2','TS2'].map((f,i)=>`<article class="showcase ${f.toLowerCase()}"><div class="showcase-orbit"></div><div class="showcase-top"><span class="eyebrow">${i?'PRÉCISION & CADENCE':'POLYVALENCE & PERFORMANCE'}</span>${sourceLabel('Catalogue réel')}</div><div class="showcase-content"><div><h2>${f}</h2><p>${families[f].subtitle}</p><div class="showcase-stats"><span><b>${families[f].models.length}</b> modèles</span><span><b>${i?'8,4':'2–170'}</b> kg</span></div></div><div class="product-stage">${robot(f)}</div></div><footer><span>${i?'SCARA · 4 axes':'Articulés · 6 axes'}</span><button class="explore" data-go="family/${f}">Explorer la famille <span>↗</span></button></footer></article>`).join('')}</div>${panel('Catalogue des produits',catalogueTable(),sourceLabel('15 modèles · données réelles'))}<div class="equipment-banner"><div><h2>Au-delà du robot</h2><p>Contrôleurs CS9, pupitres SP2 et robotique mobile.</p></div><button class="primary" data-go="equipment">Découvrir les équipements →</button></div>`};
lifecycle=function(){let s=roadSteps[roadFocus];return `<div class="road-experience"><div class="road-top"><span class="source-pill mock">◌ Trajectoire illustrative</span><div class="road-controls"><button data-road-step="-1" aria-label="Étape précédente" ${roadFocus===0?'disabled':''}>←</button><span>${roadFocus+1} / ${roadSteps.length}</span><button data-road-step="1" aria-label="Étape suivante" ${roadFocus===4?'disabled':''}>→</button></div></div><div class="road-perspective"><div class="road-deck">${roadSteps.map((r,i)=>`<button data-road-index="${i}" class="road-tile ${roadFocus===i?'focused':''}" aria-pressed="${roadFocus===i}"><span class="road-year">${r[0]}</span><span class="road-node">${i<roadFocus?'✓':i+1}</span><b>${r[1]}</b></button>`).join('')}</div></div><div class="road-selected"><div><small>ÉTAPE ${roadFocus+1} · ${s[0]}</small><h3>${s[1]}</h3><p>${s[2]}</p></div><span class="road-count">0${roadFocus+1}</span></div><div class="initiative-list"><h4>Principales initiatives</h4>${[s[3],s[4],'Coordination produit & services'].map((x,i)=>`<button class="initiative initiative-${i}" data-detail="${x}"><span>${['◇','↗','◎'][i]}</span><div><b>${x}</b><small>${['Cadrage & livrables','Jalons & validation','Suivi transversal'][i]}</small></div><span class="initiative-progress">${[85,62,40][i]} %</span></button>`).join('')}</div></div>`};
familyPage=function(f,model){let m=modelByName[model],members=realModels.filter(x=>x.family===f);return `<div class="hero product-hero"><div class="hero-photo">${robot(model||f)}</div><div class="hero-title"><div class="eyebrow">${m?'FICHE PRODUIT':'FAMILLE DE ROBOTS'} · ${SOURCE.source}</div><h1>${model||'Famille '+f}</h1><p>${families[f].subtitle}</p><div class="tags">${families[f].tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div style="margin-top:13px">${sourceLabel('Photo & spécifications réelles')}${sourceLabel('KPI & roadmap simulés','mock')}</div></div><button class="primary" data-go="roadmap">Explorer la roadmap ↗</button></div>${m?`<div class="grid spec-highlights">${[['Charge utile',fmt(m.load)+' kg','box'],['Portée',m.reach.toLocaleString('fr-FR')+' mm','road'],['Répétabilité','± '+fmt(m.repeatability,3)+' mm','compare'],['Contrôleur',m.controller,'soft']].map(x=>`<div class="spec-highlight">${icon(x[2])}<small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div>`:`<div class="section-caption"><h2>La famille en un regard</h2>${sourceLabel('Scénario KPI','mock')}</div><div class="grid kpis">${domains.map((d,i)=>kpi(d[1],['128,4 M€','24,8 k€','94,2 %','2,4 %','42 000 h','72 %'][i],['+18 %','−6 %','+2,8 pts','−0,6 pt','+8 000 h','+9 pts'][i],d[2],d[0],'Données simulées · scénario TX2',i)).join('')}</div>`}<div class="grid twocol">${panel('Cycle de vie & trajectoire produit',lifecycle())}${m?panel('Spécifications techniques',table(['Caractéristique','Brochure'],specRows(m))+`<p class="section-note">Source : ${SOURCE.source}, p. 3. Montage TX2-200/L : consulter Stäubli pour les restrictions. Les variantes spécialisées peuvent avoir des spécifications différentes.</p>`):chartPanel()}</div>${m?panel('Équipements & environnements',`<div class="grid equipment-mini"><div><h3>${m.controller}</h3><p class="intro">Contrôleur indiqué dans la brochure pour ce modèle.</p><button data-go="equipment">Voir les équipements →</button></div><div><h3>Versions spécialisées</h3><p class="intro">Harsh, Humid, Stericlean, Cleanroom et autres configurations : disponibilité selon le modèle, à vérifier dans la matrice constructeur.</p>${sourceLabel('Compatibilité à confirmer','mock')}</div></div>`):panel('Les modèles de la famille',catalogueTable(members))}`};
function equipmentPage(){return `<div class="heading"><div><div class="eyebrow">L’ÉCOSYSTÈME DU ROBOT</div><h1>Équipements & solutions</h1><p class="intro">Produits présentés dans la brochure Stäubli. Photos réelles.</p></div>${sourceLabel('Brochure 02/2026')}</div><div class="grid equipment-grid">${SOURCE.equipment.map((e,i)=>`<article class="equipment-card"><div class="equipment-stage"><img src="${e.image}" alt="${e.name}" loading="lazy"></div><small>${i<4?'CONTRÔLEURS':i<6?'PUPITRES':'ROBOTIQUE MOBILE'}</small><h2>${e.name}</h2><p>${i<4?['353 × 421 × 144 mm · 12 kg','370 × 445 × 270 mm · 38 kg','370 × 445 × 297 mm · 44 kg','600 × 680 × 780 mm · 86 kg'][i]:i===4?'Écran 7 pouces · IP54 · 1,2 kg':i===5?'Écran 10,1 pouces · IP65 · 1,3 kg':'Solution mobile présentée au catalogue.'}</p></article>`).join('')}</div>${panel('Logiciels & accompagnement',`<div class="grid equipment-mini"><div><h3>SCOPE</h3><p class="intro">Surveiller, analyser et optimiser la production et les processus de maintenance.</p><button data-go="software">Performance logiciel →</button></div><div><h3>Services Stäubli</h3><p class="intro">Formation, assistance applicative, hotline et packs de services. La brochure annonce 15 ans de disponibilité des pièces.</p><button data-go="service">Performance service →</button></div></div>`)}`}
function bookingsPage(){let fields=[['Master Amount in EUR','Montant de booking en euros','Somme · utilisée dans le rapport'],['Ordered quantity','Quantité commandée','Somme · utilisée dans le rapport'],['Product Model','Modèle de produit','Axe d’analyse'],['Market','Marché','Axe d’analyse et filtre'],['Company End User','Entreprise utilisatrice finale','Axe d’analyse'],['Calendar Date','Date calendaire','Année / trimestre / mois / jour']];return `<div class="heading"><div><div class="eyebrow">SOURCE POWER BI</div><h1>Bookings & commandes</h1><p class="intro">Structure réelle extraite de Booking KPI Dashboard.pbix.</p></div>${sourceLabel('Structure vérifiée')}</div><div class="data-status"><div class="data-status-icon">↗</div><div><h2>Le modèle de booking est identifié</h2><p>Les champs et les graphiques sont lisibles. Les valeurs du modèle compressé ne sont pas encore extraites. Aucun montant fictif n’est affiché sur cette page.</p></div></div><div class="grid spec-highlights">${['Montant de booking','Quantité commandée','Modèles de produit','Période couverte'].map(x=>`<div class="spec-highlight"><small>${x}</small><strong>—</strong><small>Valeurs non extraites</small></div>`).join('')}</div>${panel('Champs disponibles dans le rapport',table(['Champ source','Usage proposé','Agrégation / rôle'],fields))}<div class="grid twocol" style="margin-top:22px">${panel('Analyses prévues',bars(['Par modèle','Par marché','Par client','Par période'],[100,100,100,100],'')+'<p class="section-note">Cette liste décrit les axes présents dans le PBIX. Les barres représentent les analyses disponibles, pas des résultats métier.</p>')}${panel('Points à valider',`<p class="intro">Le montant de booking ne doit pas être assimilé automatiquement au chiffre d’affaires facturé. La quantité commandée ne prouve pas une quantité livrée.</p><p class="intro">Le comptage des entreprises dans le rapport n’établit pas à lui seul un nombre de clients uniques, de nouveaux clients ou un taux de fidélisation.</p>`)}</div>`}
roadmap=function(){return `<div class="heading"><div><div class="eyebrow">UNE TRAJECTOIRE PARTAGÉE</div><h1>Roadmap produits</h1><p class="intro">Parcourez les étapes et leurs initiatives avec les flèches ou les cartes.</p></div>${sourceLabel('Scénario de démonstration','mock')}</div><div class="grid twocol">${panel('Cycle de vie du portfolio',lifecycle())}${panel('Les familles concernées',`<div class="road-family-preview">${['TX2','TS2'].map(f=>`<a href="#family/${f}" class="list-row">${robot(f)}<div><b>${f}</b><div class="meta">${families[f].models.length} modèles au catalogue</div></div><span class="push">↗</span></a>`).join('')}</div><p class="section-note">Les étapes, dates, initiatives et taux d’avancement sont fictifs. La brochure ne fournit pas de roadmap ni de dates de fin de vie.</p>`)}</div>`};
let technicalMetric='load';
function technicalPage(){let measures={load:['Charge utile','kg'],reach:['Portée au poignet','mm'],energy:['Consommation VDMA 24608','kWh']},selected=$('#family').value,rows=realModels.filter(m=>selected==='Toutes'||m.family===selected);return `<div class="heading"><div><div class="eyebrow">BENCHMARK PRODUIT</div><h1>Performance technique</h1><p class="intro">Comparer les caractéristiques publiées dans la brochure Stäubli.</p></div>${sourceLabel('Données réelles')}</div><div class="tabs technical-tabs">${Object.entries(measures).map(([k,v])=>`<button data-technical="${k}" class="${technicalMetric===k?'selected':''}">${v[0]}</button>`).join('')}</div>${panel(measures[technicalMetric][0],bars(rows.map(m=>m.name),rows.map(m=>m[technicalMetric]),' '+measures[technicalMetric][1]))}<p class="section-note">Source : Product Range.pdf, 02/2026, V17, p. 3. Le filtre Famille s’applique ; les caractéristiques sont indépendantes des filtres Période et Région. Comparaison de caractéristiques constructeur, pas de résultats opérationnels.</p>`}
const previousDomainPage=domainPage;
domainPage=function(k){let c=configs[k];let h=previousDomainPage(k);return `<div class="performance-banner domain-${k}"><div><div class="eyebrow">PERFORMANCE / ${c.title.toUpperCase()}</div><h2>${{sales:'Identifier les moteurs de croissance.',costs:'Comprendre chaque levier de coût.',industrial:'Anticiper pour mieux livrer.',applications:'Relier le produit à ses usages.',service:'Faire durer la performance.',software:'Accélérer l’adoption des solutions.'}[k]}</h2><p>Explorez les indicateurs, leurs tendances et les points d’attention.</p></div><div class="banner-glyph">${icon(domains.find(d=>d[0]===k)[2])}</div></div><div class="data-provenance">${sourceLabel('KPI simulés','mock')}<span>Les fichiers ne fournissent pas de résultats vérifiés pour ces indicateurs.</span>${k==='sales'?'<button data-go="bookings" class="textlink">Voir la source booking →</button>':''}</div>${h}`};
comparison=function(){return `<div class="heading"><div><div class="eyebrow">LE BON ROBOT POUR LE BON USAGE</div><h1>Comparer les familles</h1><p class="intro">Caractéristiques techniques de la brochure, hors configurations spéciales.</p></div>${sourceLabel('Données réelles')}</div><div class="grid comparison-cards">${['TX2','TS2'].map(f=>`<section class="panel">${robot(f)}<h2>${f}</h2><p class="intro">${families[f].subtitle}</p><button class="primary" data-go="family/${f}">Explorer ${f} →</button></section>`).join('')}</div>${panel('Caractéristiques de gamme',table(['Caractéristique','TX2','TS2'],[['Type','Articulé · 6 axes','SCARA · 4 axes'],['Modèles du catalogue','11','4'],['Charge utile','2–170 kg','8,4 kg'],['Portée au poignet','515–2 609 mm','460–1 000 mm'],['Répétabilité X-Y','± 0,015 à ± 0,03 mm','± 0,01 à ± 0,02 mm'],['Contrôleurs','CS9 LP / MP / HP','CS9 SE ou LP']]))}`};
const navV2=renderNav;
renderNav=function(){navV2();let perf=$('details[data-nav-group="performance"]');if(perf)perf.insertAdjacentHTML('beforeend','<a href="#bookings" class="sub '+(current==='bookings'?'active':'')+'">'+icon('sales')+'Bookings · source PBIX</a><a href="#technical" class="sub '+(current==='technical'?'active':'')+'">'+icon('compare')+'Performance technique</a>');$('#nav').insertAdjacentHTML('beforeend','<a href="#equipment" class="'+(current==='equipment'?'active':'')+'">'+icon('box')+'Équipements</a>')};
const renderV2=render;
render=function(){let route=location.hash.slice(1)||'family/TX2';if(['bookings','equipment','technical'].includes(route)){current=route;renderNav();$('#main').innerHTML='<div class="crumb"><span>Workspace / '+({bookings:'Bookings',equipment:'Équipements',technical:'Performance technique'}[route])+'</span></div>'+({bookings:bookingsPage,equipment:equipmentPage,technical:technicalPage}[route])();document.title='Stäubli · '+({bookings:'Bookings',equipment:'Équipements',technical:'Performance technique'}[route])}else renderV2();let badge=$('.crumb .demo');if(badge)badge.textContent=['portfolio','comparison'].includes(current)||current.startsWith('product/')?'Catalogue réel · PoC':'Catalogue réel / KPI simulés';let foot=$('.footer');if(foot)foot.lastElementChild.textContent=foot.lastElementChild.textContent.replace(/v0\.[12]/,'v0.3');let main=$('#main');main.classList.remove('page-enter');void main.offsetWidth;main.classList.add('page-enter');document.querySelectorAll('.showcase').forEach(card=>{card.addEventListener('pointermove',e=>{if(!matchMedia('(hover:hover)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;let r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.setProperty('--rx',(-y*5)+'deg');card.style.setProperty('--ry',(x*6)+'deg')});card.addEventListener('pointerleave',()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')})});};
document.addEventListener('input',e=>{if(e.target.id==='catalogueQuery'){catalogueQuery=e.target.value;let f=current.startsWith('family/')?current.split('/')[1]:null;$('#catalogueRows').innerHTML=catalogueRows(f?realModels.filter(m=>m.family===f):realModels)}});
document.addEventListener('change',e=>{if(e.target.id==='catalogueStatus'){catalogueStatus=e.target.value;render()}});
document.addEventListener('click',e=>{let sort=e.target.closest('[data-sort]'),step=e.target.closest('[data-road-step]'),idx=e.target.closest('[data-road-index]'),tech=e.target.closest('[data-technical]');if(tech){technicalMetric=tech.dataset.technical;render()}if(sort){catalogueDirection=catalogueOrder===sort.dataset.sort?-catalogueDirection:1;catalogueOrder=sort.dataset.sort;render()}if(step||idx){let y=window.scrollY;roadFocus=idx?+idx.dataset.roadIndex:Math.max(0,Math.min(4,roadFocus+(+step.dataset.roadStep)));render();window.scrollTo(0,y)}});
document.querySelector('.sidefoot').innerHTML='<span class="dot"></span> Product Line Workspace<br>Catalogue 02/2026 · PoC v0.3';
